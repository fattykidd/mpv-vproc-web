# Runs the whole stack with a simulated capture card and no GPU, for a
# machine without the hardware (a test VM, CI). It builds against the stand-in
# SDK in tests/mock_sdk, so no Blackmagic download is needed, and mpv decodes
# and processes every frame but displays nothing (--vo=null).
#
#   docker compose -f compose.sim.yml up --build
#
# Then open http://<host>:8000. The simulated source starts with no signal,
# plays 1080p60 SDR for about 10 s, then switches to 2160p23.976 HDR10.

services:
  vproc-sim:
    build:
      context: .
      additional_contexts:
        decklink_sdk: ./tests/mock_sdk/include
    image: vproc:sim
    container_name: vproc-sim
    init: true
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      MOCK_DECKLINK_SCRIPT: "nosignal:60;1080p60:yuv10:sdr:600;2160p23976:yuv10:pq:100000:1000"
      MOCK_FRAME_INTERVAL_MS: "16"
      VPROC_GPU_CONTEXT: auto
      VPROC_MPV_EXTRA_ARGS: "--vo=null --force-window=no"
      VPROC_OUTPUT_SIZE: 3840x2160
    tmpfs:
      - /run/vproc:uid=1000,gid=1000,mode=0770,size=16m
    volumes:
      - vproc-sim-data:/data

volumes:
  vproc-sim-data: