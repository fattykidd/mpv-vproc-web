# mpv-vproc-web: run scripts/setup-env.sh (or copy .env.example to .env and fill in
# the first section), then
#   docker compose pull
#   docker compose up -d
#   docker compose exec vproc python3 -m vproc.doctor   # if anything is off
#
# This uses the published image. To build it yourself instead (needs the
# DeckLink SDK headers), add compose.build.yml; see the README.

services:
  vproc:
    image: ghcr.io/fattykidd/mpv-vproc-web:${VPROC_VERSION:-latest}
    container_name: vproc
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    labels:
      # Lets Watchtower keep this container up to date, if you use it (docs/INSTALL.md, step 12).
      - com.centurylinklabs.watchtower.enable=true
    env_file:
      - path: .env
        required: false
    # Host networking lets an Unfolded Circle Remote discover the driver (mDNS).
    # The web UI is on port VPROC_PORT (default 8000) of the server itself.
    network_mode: host
    devices:
      - /dev/dri:/dev/dri                  # GPU display output (KMS)
      - /dev/blackmagic:/dev/blackmagic    # DeckLink card(s)
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-109}"
    volumes:
      # The capture library from the host's Desktop Video install (proprietary, so mounted, not copied).
      - ${DECKLINK_LIB:-/usr/lib/libDeckLinkAPI.so}:/usr/lib/libDeckLinkAPI.so:ro
      - vproc-data:/data
    tmpfs:
      - /run/vproc:uid=1000,gid=1000,mode=0770,size=16m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  vproc-data:
